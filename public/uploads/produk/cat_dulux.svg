<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </radialGradient>
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="canBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="85%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="metalRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <rect width="500" height="500" fill="url(#bgGlow)"/>
  <ellipse cx="250" cy="445" rx="140" ry="22" fill="url(#floorShadow)"/>

  <!-- Paint Can Group -->
  <g transform="translate(0, 15)">
    <!-- Metal Handle (Gagang Kaleng) -->
    <path d="M 125,210 C 110,80 390,80 375,210" fill="none" stroke="#64748b" stroke-width="7"/>
    <path d="M 125,210 C 110,80 390,80 375,210" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>

    <!-- Handle Pivot Studs -->
    <circle cx="125" cy="210" r="9" fill="#334155" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="375" cy="210" r="9" fill="#334155" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Bottom Rim -->
    <ellipse cx="250" cy="420" rx="125" ry="22" fill="#082f49"/>
    
    <!-- Cylindrical Can Body -->
    <path d="M 125,180 L 125,420 C 125,435 375,435 375,420 L 375,180 Z" fill="url(#canBody)" stroke="#0284c7" stroke-width="2"/>

    <!-- Rainbow Wave / Swoosh (Dulux Identity) -->
    <g transform="translate(250, 245)">
      <!-- Curved colorful ribbons -->
      <path d="M -125,30 Q 0,-30 125,10 L 125,45 Q 0,5 -125,65 Z" fill="#ef4444" opacity="0.9"/>
      <path d="M -125,20 Q 0,-40 125,0 L 125,20 Q 0,-20 -125,40 Z" fill="#f59e0b" opacity="0.9"/>
      <path d="M -125,10 Q 0,-50 125,-10 L 125,0 Q 0,-30 -125,20 Z" fill="#10b981" opacity="0.9"/>
      <path d="M -125,0 Q 0,-60 125,-20 L 125,-10 Q 0,-40 -125,10 Z" fill="#6366f1" opacity="0.9"/>
    </g>

    <!-- Dulux Brand Name -->
    <g transform="translate(250, 230)">
      <text x="0" y="0" font-family="'Trebuchet MS', 'Arial Black', sans-serif" font-size="44" font-weight="900" font-style="italic" fill="#ffffff" text-anchor="middle" letter-spacing="1">Dulux</text>
    </g>

    <!-- Product Sub-Brand Name -->
    <g transform="translate(250, 315)">
      <rect x="-115" y="-20" width="230" height="36" rx="6" fill="#0f172a"/>
      <text x="0" y="4" font-family="'Arial Black', sans-serif" font-size="18" font-weight="900" fill="#facc15" text-anchor="middle" letter-spacing="1">WEATHERSHIELD</text>
    </g>

    <!-- Features -->
    <text x="250" y="355" font-family="'Arial', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">CAT EKSTERIOR TAHAN CUACA</text>
    <text x="250" y="375" font-family="'Arial', sans-serif" font-size="11" font-weight="600" fill="#bae6fd" text-anchor="middle">KEEP COOL &#8226; PERLINDUNGAN 5 TAHUN</text>

    <!-- Volume 2.5 L Badge -->
    <g transform="translate(250, 410)">
      <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#ef4444"/>
      <text x="0" y="4" font-family="'Arial Black', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2.5 LITER</text>
    </g>

    <!-- Top Metal Ring & Lid (Tutup Kaleng) -->
    <ellipse cx="250" cy="180" rx="125" ry="22" fill="url(#metalRim)" stroke="#64748b" stroke-width="3"/>
    <ellipse cx="250" cy="180" rx="112" ry="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <ellipse cx="250" cy="180" rx="90" ry="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>
</svg>
