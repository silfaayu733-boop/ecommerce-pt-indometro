<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </radialGradient>
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <!-- Natural Wood Plywood Gradients -->
    <linearGradient id="woodFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ddb892"/>
      <stop offset="35%" stop-color="#e6ccb2"/>
      <stop offset="70%" stop-color="#d4a373"/>
      <stop offset="100%" stop-color="#b08968"/>
    </linearGradient>
    <linearGradient id="plyEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7f4f24"/>
      <stop offset="50%" stop-color="#936639"/>
      <stop offset="100%" stop-color="#582f0e"/>
    </linearGradient>
  </defs>

  <rect width="500" height="500" fill="url(#bgGlow)"/>
  <ellipse cx="250" cy="435" rx="180" ry="22" fill="url(#floorShadow)"/>

  <!-- 3D Plywood Sheet Stack (Tumpukan Triplek) -->
  <g transform="translate(250, 220)">
    <!-- Bottom Layers Thickness Edge -->
    <polygon points="-170,40 10,140 170,40 170,75 10,175 -170,75" fill="url(#plyEdge)" stroke="#582f0e" stroke-width="1.5"/>

    <!-- Plywood Layers Stripes (Garis Lapisan Kayu / Veneer) -->
    <path d="M -170,50 L 10,150 L 170,50" stroke="#fdf0d5" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M -170,60 L 10,160 L 170,60" stroke="#7f4f24" stroke-width="2" fill="none" opacity="0.9"/>
    <path d="M -170,68 L 10,168 L 170,68" stroke="#fdf0d5" stroke-width="2" fill="none" opacity="0.7"/>

    <!-- Top Plywood Face in Isometric 3D -->
    <polygon points="0,-120 170,40 10,140 -160,-20" fill="url(#woodFace)" stroke="#7f4f24" stroke-width="2"/>

    <!-- Natural Wood Grain Swirls (Urat Kayu Meranti) -->
    <g fill="none" stroke="#a68a64" stroke-width="2" opacity="0.5">
      <path d="M -120,-30 C -80,20 -20,10 60,70 T 140,50"/>
      <path d="M -140,-10 C -90,40 -10,30 80,90 T 150,60"/>
      <path d="M -80,-80 C -40,-30 40,-20 100,20"/>
      <path d="M -30,-100 C 10,-60 80,-40 130,-10"/>
      <!-- Small Wood Knots / Lingkaran Urat Kayu -->
      <ellipse cx="-20" cy="30" rx="14" ry="6" transform="rotate(-15 -20 30)" stroke="#7f4f24" stroke-width="2.5" opacity="0.6"/>
      <ellipse cx="-20" cy="30" rx="6" ry="2" fill="#7f4f24" opacity="0.7"/>
    </g>

    <!-- Industrial Grade Brand Stamp on Plywood Face -->
    <g transform="translate(30, 40) rotate(-16)">
      <rect x="-80" y="-22" width="160" height="44" rx="4" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8,4"/>
      <text x="0" y="-3" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#dc2626" text-anchor="middle">MERANTI PRIMA</text>
      <text x="0" y="14" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">TEBAL 9 MM - SNI</text>
    </g>
  </g>

  <!-- Product Badge -->
  <g transform="translate(250, 405)">
    <rect x="-170" y="-30" width="340" height="56" rx="10" fill="#0f172a" stroke="#d97706" stroke-width="3"/>
    <text x="0" y="-6" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">TRIPLEK MERANTI 9 MM</text>
    <text x="0" y="16" font-family="'Arial', sans-serif" font-size="12" font-weight="bold" fill="#fde047" text-anchor="middle">Ukuran 122 x 244 cm &#8226; Kuat, Padat, dan Halus</text>
  </g>
</svg>

