<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="pailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="20%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="nipponBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="lidBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="pailShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="20" fill="url(#bgGrad)"/>
  <circle cx="250" cy="260" r="170" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="250" cy="425" rx="145" ry="25" fill="#94a3b8" opacity="0.4" filter="blur(6px)"/>

  <!-- Bucket / Pail Body -->
  <g filter="url(#pailShadow)">
    <path d="M 140 160 L 160 395 Q 162 410 250 410 Q 338 410 340 395 L 360 160 Z" fill="url(#pailGrad)"/>
    <ellipse cx="250" cy="395" rx="90" ry="14" fill="#cbd5e1"/>

    <!-- Wire Handle Pivot -->
    <rect x="132" y="180" width="12" height="20" rx="3" fill="#64748b"/>
    <rect x="356" y="180" width="12" height="20" rx="3" fill="#64748b"/>
    <path d="M 138 185 C 138 90, 362 90, 362 185" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <rect x="220" y="93" width="60" height="12" rx="4" fill="#1d4ed8"/>

    <!-- Upper Collar -->
    <ellipse cx="250" cy="160" rx="112" ry="22" fill="#e2e8f0"/>
    <path d="M 136 150 L 138 165 Q 138 185 250 185 Q 362 185 362 165 L 364 150 Z" fill="#1d4ed8"/>

    <!-- Blue Lid -->
    <ellipse cx="250" cy="148" rx="114" ry="20" fill="url(#lidBlue)"/>
    <ellipse cx="250" cy="144" rx="100" ry="15" fill="#1e40af"/>

    <!-- Front Label Surface -->
    <path d="M 148 205 L 157 370 Q 250 382 343 370 L 352 205 Q 250 215 148 205 Z" fill="#ffffff"/>

    <!-- Nippon Paint Red Sun Icon Header -->
    <circle cx="250" cy="225" r="16" fill="#dc2626"/>
    <text x="250" y="248" font-family="'Arial', sans-serif" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle" letter-spacing="1">NIPPON PAINT</text>

    <!-- Curved Vinilex Banner -->
    <path d="M 152 255 L 154 295 Q 250 310 346 295 L 348 255 Q 250 268 152 255 Z" fill="url(#nipponBlue)"/>
    <text x="250" y="290" font-family="'Arial Black', Impact, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">VINILEX</text>

    <!-- 5000 Subtitle -->
    <text x="250" y="318" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#dc2626" text-anchor="middle">5000</text>
    <text x="250" y="334" font-family="'Arial', sans-serif" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">CAT TEMBOK ANTI PUDAR</text>

    <!-- Features -->
    <rect x="180" y="348" width="140" height="18" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="250" y="361" font-family="'Arial', sans-serif" font-size="9" font-weight="bold" fill="#1e3a8a" text-anchor="middle">DAPAT DICUCI &#8226; CEPAT KERING</text>

    <!-- 5 KG Seal -->
    <g transform="translate(305, 335)">
      <circle cx="0" cy="0" r="20" fill="#facc15" stroke="#ffffff" stroke-width="2"/>
      <text x="0" y="-2" font-family="'Arial Black', sans-serif" font-size="10" font-weight="bold" fill="#78350f" text-anchor="middle">5</text>
      <text x="0" y="10" font-family="'Arial Black', sans-serif" font-size="9" font-weight="bold" fill="#78350f" text-anchor="middle">KG</text>
    </g>
  </g>

  <!-- Top Ribbon -->
  <rect x="25" y="25" width="220" height="34" rx="8" fill="#1d4ed8"/>
  <text x="135" y="47" font-family="'Arial', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">CAT VINILEX 5 KG</text>
</svg>
