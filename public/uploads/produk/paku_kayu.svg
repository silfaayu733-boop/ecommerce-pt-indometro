<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="steelNail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="35%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="boxWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="nailShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="20" fill="url(#bgGrad)"/>
  <ellipse cx="250" cy="430" rx="170" ry="24" fill="#64748b" opacity="0.35" filter="blur(6px)"/>

  <!-- Cardboard Box in Background -->
  <g transform="translate(60, 150)">
    <path d="M 40 40 L 320 40 L 350 180 L 10 180 Z" fill="url(#boxWood)" stroke="#78350f" stroke-width="2"/>
    <text x="180" y="85" font-family="'Arial Black', sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">PAKU KAYU</text>
    <text x="180" y="108" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#fef08a" text-anchor="middle">SNI BAJA BERKUALITAS</text>
    <rect x="110" y="125" width="140" height="22" rx="4" fill="#78350f"/>
    <text x="180" y="140" font-family="'Arial', sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">BERAT BERSIH: 10 KG</text>
  </g>

  <!-- Big Steel Nails in Foreground -->
  <g filter="url(#nailShadow)">
    <!-- Nail 1 (Diagonal Left) -->
    <g transform="translate(180, 270) rotate(-35)">
      <!-- Flat Head -->
      <ellipse cx="0" cy="0" rx="28" ry="7" fill="url(#steelNail)" stroke="#334155" stroke-width="1.5"/>
      <ellipse cx="0" cy="0" rx="22" ry="4" fill="none" stroke="#64748b" stroke-width="1"/>
      <!-- Shank -->
      <rect x="-7" y="7" width="14" height="180" fill="url(#steelNail)" stroke="#334155" stroke-width="1.5"/>
      <!-- Diamond Sharp Tip -->
      <polygon points="-7,187 0,225 7,187" fill="#475569" stroke="#334155" stroke-width="1.5"/>
    </g>

    <!-- Nail 2 (Diagonal Right) -->
    <g transform="translate(310, 260) rotate(25)">
      <!-- Flat Head -->
      <ellipse cx="0" cy="0" rx="26" ry="6" fill="url(#steelNail)" stroke="#334155" stroke-width="1.5"/>
      <!-- Shank -->
      <rect x="-6.5" y="6" width="13" height="160" fill="url(#steelNail)" stroke="#334155" stroke-width="1.5"/>
      <!-- Diamond Tip -->
      <polygon points="-6.5,166 0,200 6.5,166" fill="#475569" stroke="#334155" stroke-width="1.5"/>
    </g>

    <!-- Nail 3 (Lying Horizontal Foreground) -->
    <g transform="translate(250, 400) rotate(80)">
      <ellipse cx="0" cy="0" rx="24" ry="6" fill="url(#steelNail)" stroke="#334155" stroke-width="1.5"/>
      <rect x="-6" y="6" width="12" height="150" fill="url(#steelNail)" stroke="#334155" stroke-width="1.5"/>
      <polygon points="-6,156 0,185 6,156" fill="#475569" stroke="#334155" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Top Spec Ribbon -->
  <rect x="25" y="25" width="220" height="34" rx="8" fill="#b45309"/>
  <text x="135" y="47" font-family="'Arial', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">PAKU KAYU SNI 10 KG</text>

  <!-- Quality Stamp -->
  <g transform="translate(425, 70)">
    <circle cx="0" cy="0" r="32" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="-8" font-family="'Arial Black', sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">CAMPUR</text>
    <text x="0" y="7" font-family="'Arial Black', sans-serif" font-size="12" font-weight="900" fill="#facc15" text-anchor="middle">5-10 CM</text>
    <text x="0" y="18" font-family="'Arial', sans-serif" font-size="7" font-weight="bold" fill="#38bdf8" text-anchor="middle">ANTI BENGKOK</text>
  </g>

  <!-- Bottom Info -->
  <rect x="130" y="450" width="240" height="24" rx="12" fill="#1e293b"/>
  <text x="250" y="466" font-family="'Arial', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">BAJA TINGGI &#8226; TEMBUS KAYU KERAS</text>
</svg>
