<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="graniteSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="goldVein" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="boxGranite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="goldBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="graniteShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="16" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Luxury Dark Ambient Background for Marble Contrast -->
  <rect width="500" height="500" rx="20" fill="url(#bgGrad)"/>

  <!-- Radial Soft Spotlight -->
  <circle cx="250" cy="260" r="210" fill="#38bdf8" opacity="0.1"/>

  <!-- Floor Shadow -->
  <ellipse cx="250" cy="435" rx="190" ry="32" fill="#000000" opacity="0.5" filter="blur(10px)"/>

  <!-- Cardboard Dus in Background -->
  <g transform="translate(45, 100)">
    <path d="M 40 30 L 370 30 L 390 190 L 20 190 Z" fill="url(#boxGranite)" stroke="#475569" stroke-width="2"/>
    <text x="205" y="75" font-family="'Arial Black', sans-serif" font-size="22" font-weight="900" fill="#facc15" text-anchor="middle" letter-spacing="3">INDOGRESS</text>
    <text x="205" y="98" font-family="'Arial', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">GRANITE TILE &#8226; 60 x 60 cm</text>
    
    <rect x="135" y="115" width="140" height="22" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <text x="205" y="130" font-family="'Arial', sans-serif" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle">1 DUS = 4 PCS (1.44 M&#178;)</text>
  </g>

  <!-- Large 3D Granite Slab (60x60 Glazed Porcelain Tile) -->
  <g filter="url(#graniteShadow)">
    <!-- Slab Thickness Edges -->
    <path d="M 250 385 L 430 265 L 430 280 L 250 400 Z" fill="#94a3b8"/>
    <path d="M 70 265 L 250 385 L 250 400 L 70 280 Z" fill="#cbd5e1"/>

    <!-- Polished Granite Surface (Isometric 60x60) -->
    <!-- Points: Top(250, 145), Right(430, 265), Bottom(250, 385), Left(70, 265) -->
    <path d="M 250 145 L 430 265 L 250 385 L 70 265 Z" fill="url(#graniteSurface)" stroke="#ffffff" stroke-width="2"/>

    <!-- High-End Carrara Marble Veins (Smoke Grey & Gold Flecks) -->
    <path d="M 120 230 Q 180 200 240 250 Q 280 280 360 250 Q 400 240 420 260" fill="none" stroke="#94a3b8" stroke-width="3" opacity="0.5"/>
    <path d="M 160 270 Q 220 240 260 270 Q 310 320 380 290" fill="none" stroke="#64748b" stroke-width="2.5" opacity="0.6"/>
    <path d="M 210 180 Q 250 210 290 190 Q 340 220 370 200" fill="none" stroke="#cbd5e1" stroke-width="4" opacity="0.7"/>
    <path d="M 100 260 Q 150 280 200 260 Q 230 330 270 340" fill="none" stroke="#94a3b8" stroke-width="2" opacity="0.4"/>
    
    <!-- Luxurious Golden Veins (Calacatta Gold Accent) -->
    <path d="M 150 240 Q 220 220 250 240 Q 300 270 350 260" fill="none" stroke="url(#goldVein)" stroke-width="1.8" opacity="0.8"/>
    <path d="M 230 300 Q 270 310 310 290" fill="none" stroke="url(#goldVein)" stroke-width="1.5" opacity="0.7"/>

    <!-- Nano Polished Mirror Reflection Sheen -->
    <path d="M 150 160 L 220 150 L 330 350 L 260 360 Z" fill="#ffffff" opacity="0.4"/>
    <path d="M 230 150 L 270 147 L 380 320 L 340 325 Z" fill="#ffffff" opacity="0.2"/>

    <!-- Brand Gold Stamp in Center -->
    <g transform="translate(250, 265)">
      <ellipse cx="0" cy="0" rx="45" ry="22" fill="#0f172a" opacity="0.9"/>
      <ellipse cx="0" cy="0" rx="42" ry="20" fill="none" stroke="url(#goldBadge)" stroke-width="1.5"/>
      <text x="0" y="-3" font-family="'Arial Black', sans-serif" font-size="9" font-weight="900" fill="#facc15" text-anchor="middle" letter-spacing="1">INDOGRESS</text>
      <text x="0" y="9" font-family="'Arial', sans-serif" font-size="7" font-weight="bold" fill="#ffffff" text-anchor="middle">POLISHED NANO</text>
    </g>

    <!-- Beveled Tile Precision Edges -->
    <path d="M 250 148 L 426 265 L 250 382 L 74 265 Z" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- Top Left Product Spec Badge -->
  <rect x="25" y="25" width="230" height="34" rx="8" fill="url(#goldBadge)"/>
  <text x="140" y="47" font-family="'Arial Black', sans-serif" font-size="12" font-weight="900" fill="#0f172a" text-anchor="middle">GRANIT POLISHED 60x60</text>

  <!-- Top Right Technology Badge -->
  <g transform="translate(430, 60)">
    <circle cx="0" cy="0" r="30" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="-5" font-family="'Arial Black', sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">GLAZED</text>
    <text x="0" y="8" font-family="'Arial Black', sans-serif" font-size="10" font-weight="900" fill="#facc15" text-anchor="middle">NANO</text>
    <text x="0" y="19" font-family="'Arial', sans-serif" font-size="7" font-weight="bold" fill="#ffffff" text-anchor="middle">KILAP</text>
  </g>

  <!-- Bottom Info Ribbon -->
  <rect x="120" y="450" width="260" height="24" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="250" y="466" font-family="'Arial', sans-serif" font-size="11" font-weight="bold" fill="#facc15" text-anchor="middle">MOTIF STATUARIO WHITE &#8226; SUPER GLOSS</text>
</svg>
