<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="chromeMirror" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="pouchBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="wrenchShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="20" fill="url(#bgGrad)"/>
  <ellipse cx="250" cy="430" rx="160" ry="20" fill="#64748b" opacity="0.35" filter="blur(6px)"/>

  <!-- Fabric Tool Pouch / Pockets in Background -->
  <g transform="translate(60, 150)">
    <rect x="0" y="20" width="380" height="230" rx="12" fill="url(#pouchBlue)" stroke="#3b82f6" stroke-width="2"/>
    <!-- Pouch slot seams -->
    <line x1="60" y1="90" x2="60" y2="250" stroke="#1d4ed8" stroke-width="2"/>
    <line x1="120" y1="90" x2="120" y2="250" stroke="#1d4ed8" stroke-width="2"/>
    <line x1="180" y1="90" x2="180" y2="250" stroke="#1d4ed8" stroke-width="2"/>
    <line x1="240" y1="90" x2="240" y2="250" stroke="#1d4ed8" stroke-width="2"/>
    <line x1="300" y1="90" x2="300" y2="250" stroke="#1d4ed8" stroke-width="2"/>

    <text x="190" y="55" font-family="'Arial Black', Impact, sans-serif" font-size="18" font-weight="900" fill="#facc15" text-anchor="middle" letter-spacing="2">COMBINATION WRENCH SET</text>
    <text x="190" y="75" font-family="'Arial', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">14 PCS &#8226; 8 MM SAMPAI 24 MM</text>
  </g>

  <!-- Big Chrome Combination Wrench in Foreground -->
  <g filter="url(#wrenchShadow)" transform="rotate(-30 250 250)">
    <!-- 1. Open End Head (Left) -->
    <path d="M 70 230 C 50 215, 50 285, 70 270 L 100 270 C 85 260, 85 240, 100 230 Z" fill="url(#chromeMirror)" stroke="#475569" stroke-width="2"/>

    <!-- 2. Wrench Beam Shaft -->
    <rect x="95" y="238" width="280" height="24" rx="4" fill="url(#chromeMirror)" stroke="#475569" stroke-width="1.5"/>
    <rect x="120" y="244" width="230" height="12" rx="3" fill="#94a3b8" opacity="0.6"/>

    <!-- Engraved Size on Shaft -->
    <text x="235" y="254" font-family="'Arial Black', sans-serif" font-size="10" font-weight="900" fill="#0f172a" text-anchor="middle">CHROME VANADIUM &#8226; 17 MM</text>

    <!-- 3. Ring / Box End Head (Right) -->
    <circle cx="395" cy="250" r="28" fill="url(#chromeMirror)" stroke="#475569" stroke-width="2"/>
    <!-- 12-point ring opening -->
    <circle cx="395" cy="250" r="14" fill="#0f172a"/>
    <polygon points="395,234 399,245 411,245 401,252 405,263 395,257 385,263 389,252 379,245 391,245" fill="#1e293b"/>
  </g>

  <!-- Top Spec Ribbon -->
  <rect x="25" y="25" width="240" height="34" rx="8" fill="#1e3a8a"/>
  <text x="145" y="47" font-family="'Arial', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">KUNCI RING PAS SET 14 PCS</text>

  <!-- Quality Stamp -->
  <g transform="translate(425, 70)">
    <circle cx="0" cy="0" r="32" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="-8" font-family="'Arial Black', sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">BAJA CR-V</text>
    <text x="0" y="7" font-family="'Arial Black', sans-serif" font-size="12" font-weight="900" fill="#facc15" text-anchor="middle">8-24 MM</text>
    <text x="0" y="18" font-family="'Arial', sans-serif" font-size="7" font-weight="bold" fill="#38bdf8" text-anchor="middle">ANTI SLEK</text>
  </g>

  <!-- Bottom Info -->
  <rect x="130" y="450" width="240" height="24" rx="12" fill="#1e293b"/>
  <text x="250" y="466" font-family="'Arial', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">DILENGKAPI KANTONG GULUNG KANVAS</text>
</svg>
