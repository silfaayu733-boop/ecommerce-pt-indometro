<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </radialGradient>
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pailBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="35%" stop-color="#2563eb"/>
      <stop offset="70%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="yellowLid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <rect width="500" height="500" fill="url(#bgGlow)"/>
  <ellipse cx="250" cy="445" rx="140" ry="22" fill="url(#floorShadow)"/>

  <!-- Pail Group -->
  <g transform="translate(0, 15)">
    <!-- Handle -->
    <path d="M 125,200 C 110,70 390,70 375,200" fill="none" stroke="#64748b" stroke-width="6"/>
    <circle cx="125" cy="200" r="9" fill="#eab308" stroke="#334155" stroke-width="2"/>
    <circle cx="375" cy="200" r="9" fill="#eab308" stroke="#334155" stroke-width="2"/>

    <!-- Bottom -->
    <ellipse cx="250" cy="420" rx="120" ry="20" fill="#172554"/>

    <!-- Body -->
    <path d="M 125,180 L 130,420 C 130,435 370,435 370,420 L 375,180 Z" fill="url(#pailBody)" stroke="#1e40af" stroke-width="2"/>

    <!-- Yellow Collar Banner at the Top of Pail -->
    <path d="M 125,180 L 126,225 C 126,238 374,238 374,225 L 375,180 Z" fill="url(#yellowLid)"/>

    <!-- Water Droplet Logo Graphics -->
    <g transform="translate(250, 160)">
      <path d="M 0,-30 C 18,-6 24,10 24,20 C 24,34 14,44 0,44 C -14,44 -24,34 -24,20 C -24,10 -18,-6 0,-30 Z" fill="#38bdf8" stroke="#ffffff" stroke-width="3"/>
      <ellipse cx="-7" cy="18" rx="4" ry="8" fill="#ffffff" opacity="0.7"/>
    </g>

    <!-- Bold 'NO DROP' Brand Logo -->
    <g transform="translate(250, 275)">
      <!-- Oval Badge -->
      <ellipse cx="0" cy="0" rx="105" ry="34" fill="#ffffff" stroke="#f59e0b" stroke-width="4"/>
      <text x="0" y="10" font-family="'Arial Black', Impact, sans-serif" font-size="34" font-weight="900" fill="#dc2626" text-anchor="middle" letter-spacing="1">NO DROP</text>
    </g>

    <!-- Indonesian Descriptor Banner -->
    <g transform="translate(250, 335)">
      <rect x="-115" y="-14" width="230" height="28" rx="14" fill="#facc15"/>
      <text x="0" y="5" font-family="'Arial Black', sans-serif" font-size="12" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="0.5">CAT PELAPIS ANTI BOCOR</text>
    </g>

    <text x="250" y="375" font-family="'Arial', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ELASTIS &#8226; KEDAP AIR &#8226; TAHAN CUACA</text>

    <!-- Weight 4 KG Badge -->
    <g transform="translate(250, 410)">
      <rect x="-60" y="-12" width="120" height="24" rx="6" fill="#dc2626"/>
      <text x="0" y="5" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">4 KG</text>
    </g>

    <!-- Top Yellow Lid (Tutup Ember Kuning) -->
    <ellipse cx="250" cy="180" rx="125" ry="22" fill="url(#yellowLid)" stroke="#ca8a04" stroke-width="3"/>
    <ellipse cx="250" cy="180" rx="112" ry="18" fill="#fde047" stroke="#eab308" stroke-width="2"/>
    <ellipse cx="250" cy="180" rx="90" ry="14" fill="#fef08a" stroke="#facc15" stroke-width="1.5"/>
  </g>
</svg>
