<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="steelBlade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="30%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="woodHandle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="60%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="rubberGrip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="sawShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="20" fill="url(#bgGrad)"/>
  <circle cx="250" cy="260" r="180" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="250" cy="430" rx="190" ry="20" fill="#94a3b8" opacity="0.35" filter="blur(6px)"/>

  <!-- Saw Assembly Placed Diagonally -->
  <g filter="url(#sawShadow)" transform="rotate(-20 250 250)">
    <!-- Steel Saw Blade Body -->
    <!-- Blade shape: Tapered from handle (left) to tip (right) -->
    <!-- Top spine is smooth, bottom edge has teeth pattern -->
    <path d="M 120 180 L 460 215 L 460 240 L 120 280 Z" fill="url(#steelBlade)" stroke="#64748b" stroke-width="1.5"/>

    <!-- Sharp Saw Teeth on Bottom Edge (Repeated serrations) -->
    <path d="M 120 280 
             L 130 288 L 135 281 L 145 288 L 150 281 L 160 288 L 165 281 
             L 175 288 L 180 281 L 190 288 L 195 281 L 205 288 L 210 281
             L 220 288 L 225 281 L 235 288 L 240 281 L 250 288 L 255 281
             L 265 288 L 270 281 L 280 288 L 285 281 L 295 288 L 300 281
             L 310 288 L 315 281 L 325 288 L 330 281 L 340 288 L 345 281
             L 355 288 L 360 281 L 370 288 L 375 281 L 385 288 L 390 281
             L 400 288 L 405 281 L 415 288 L 420 281 L 430 288 L 435 281
             L 445 288 L 450 281 L 460 288 L 460 240 Z" fill="#64748b"/>

    <!-- Blade Reflection Sheen -->
    <path d="M 160 190 L 220 195 L 200 265 L 140 260 Z" fill="#ffffff" opacity="0.4"/>
    <path d="M 280 200 L 330 205 L 310 255 L 260 250 Z" fill="#ffffff" opacity="0.3"/>

    <!-- Etched Brand Logo on Steel Blade -->
    <text x="290" y="235" font-family="'Arial Black', Impact, sans-serif" font-size="20" font-weight="900" fill="#475569" letter-spacing="3">HARDEN PRO</text>
    <text x="290" y="250" font-family="'Arial', sans-serif" font-size="9" font-weight="bold" fill="#64748b" letter-spacing="1">18" / 450 MM &#8226; 7 TPI 3-EDGE TEETH</text>

    <!-- Ergonomic Pistol-Grip Handle on Left -->
    <!-- Main Handle Body -->
    <path d="M 50 170 Q 140 150 150 200 L 150 270 Q 140 310 60 290 Q 30 280 40 230 Q 35 190 50 170 Z" fill="url(#woodHandle)" stroke="#7c2d12" stroke-width="2"/>

    <!-- Handle Finger Hole Opening -->
    <path d="M 75 195 Q 115 185 115 220 L 115 250 Q 115 270 75 265 Q 65 240 75 195 Z" fill="#f8fafc" stroke="#9a3412" stroke-width="2"/>

    <!-- Black Rubberized Grip Lining inside finger hole -->
    <path d="M 52 190 Q 45 230 52 270" stroke="url(#rubberGrip)" stroke-width="10" stroke-linecap="round"/>

    <!-- 3 Brass Screws / Bolts Securing Blade to Handle -->
    <circle cx="130" cy="195" r="7" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
    <circle cx="130" cy="235" r="7" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
    <circle cx="130" cy="270" r="7" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
    <line x1="126" y1="195" x2="134" y2="195" stroke="#78350f" stroke-width="1.5"/>
    <line x1="126" y1="235" x2="134" y2="235" stroke="#78350f" stroke-width="1.5"/>
    <line x1="126" y1="270" x2="134" y2="270" stroke="#78350f" stroke-width="1.5"/>
  </g>

  <!-- Top Spec Ribbon -->
  <rect x="25" y="25" width="220" height="34" rx="8" fill="#c2410c"/>
  <text x="135" y="47" font-family="'Arial', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">GERGAJI KAYU 18 INCH</text>

  <!-- Quality Stamp -->
  <g transform="translate(425, 70)">
    <circle cx="0" cy="0" r="32" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="-8" font-family="'Arial Black', sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">MATA BAJA</text>
    <text x="0" y="7" font-family="'Arial Black', sans-serif" font-size="12" font-weight="900" fill="#facc15" text-anchor="middle">SK-5</text>
    <text x="0" y="18" font-family="'Arial', sans-serif" font-size="7" font-weight="bold" fill="#38bdf8" text-anchor="middle">SIAP PAKAI</text>
  </g>

  <!-- Bottom Info -->
  <rect x="130" y="450" width="240" height="24" rx="12" fill="#334155"/>
  <text x="250" y="466" font-family="'Arial', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">MATA 3 SUDUT ASAH &#8226; POTONG CEPAT</text>
</svg>
