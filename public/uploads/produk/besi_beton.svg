<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </radialGradient>
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steelBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="25%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="75%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="rebarHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <rect width="500" height="500" fill="url(#bgGlow)"/>
  <ellipse cx="250" cy="430" rx="190" ry="25" fill="url(#floorShadow)"/>

  <!-- Steel Rebar Bundle -->
  <g transform="translate(40, 100) rotate(-15 200 150)">
    <!-- Back Row Bars -->
    <rect x="0" y="80" width="460" height="26" rx="4" fill="url(#steelBar)"/>
    <rect x="0" y="115" width="460" height="26" rx="4" fill="url(#steelBar)"/>
    <rect x="0" y="150" width="460" height="26" rx="4" fill="url(#steelBar)"/>

    <!-- Middle Row Bars with Ribs -->
    <g>
      <rect x="0" y="98" width="460" height="26" rx="4" fill="url(#steelBar)"/>
      <!-- Ribs pattern -->
      <path d="M 40,98 L 55,124 M 70,98 L 85,124 M 100,98 L 115,124 M 130,98 L 145,124 M 160,98 L 175,124 M 190,98 L 205,124 M 220,98 L 235,124 M 250,98 L 265,124 M 280,98 L 295,124 M 310,98 L 325,124 M 340,98 L 355,124 M 370,98 L 385,124 M 400,98 L 415,124" stroke="#ffffff" stroke-width="2.5" opacity="0.6"/>
    </g>

    <g>
      <rect x="0" y="132" width="460" height="26" rx="4" fill="url(#steelBar)"/>
      <!-- Ribs pattern -->
      <path d="M 40,132 L 55,158 M 70,132 L 85,158 M 100,132 L 115,158 M 130,132 L 145,158 M 160,132 L 175,158 M 190,132 L 205,158 M 220,132 L 235,158 M 250,132 L 265,158 M 280,132 L 295,158 M 310,132 L 325,158 M 340,132 L 355,158 M 370,132 L 385,158 M 400,132 L 415,158" stroke="#ffffff" stroke-width="2.5" opacity="0.6"/>
    </g>

    <!-- Front Center Bar -->
    <g>
      <rect x="0" y="115" width="460" height="28" rx="4" fill="url(#steelBar)"/>
      <path d="M 35,115 L 50,143 M 65,115 L 80,143 M 95,115 L 110,143 M 125,115 L 140,143 M 155,115 L 170,143 M 185,115 L 200,143 M 215,115 L 230,143 M 245,115 L 260,143 M 275,115 L 290,143 M 305,115 L 320,143 M 335,115 L 350,143 M 365,115 L 380,143 M 395,115 L 410,143" stroke="#ffffff" stroke-width="3" opacity="0.75"/>
    </g>

    <!-- Steel Binding Wire Ties (Kawat Bendrat) -->
    <rect x="90" y="70" width="12" height="115" rx="3" fill="#334155" stroke="#f1f5f9" stroke-width="1.5"/>
    <rect x="360" y="70" width="12" height="115" rx="3" fill="#334155" stroke="#f1f5f9" stroke-width="1.5"/>

    <!-- Bar Heads Cut Section -->
    <ellipse cx="0" cy="93" rx="7" ry="13" fill="url(#rebarHead)"/>
    <ellipse cx="0" cy="111" rx="7" ry="13" fill="url(#rebarHead)"/>
    <ellipse cx="0" cy="129" rx="7" ry="14" fill="url(#rebarHead)"/>
    <ellipse cx="0" cy="145" rx="7" ry="13" fill="url(#rebarHead)"/>
    <ellipse cx="0" cy="163" rx="7" ry="13" fill="url(#rebarHead)"/>
  </g>

  <!-- Product Label Tag Hanging -->
  <g transform="translate(190, 310)">
    <polygon points="0,0 200,0 180,90 -20,90" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
    <text x="85" y="32" font-family="'Arial Black', sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">BESI BETON</text>
    <text x="85" y="56" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#facc15" text-anchor="middle">10 mm POLOS SNI</text>
    <text x="85" y="78" font-family="'Arial', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Panjang 12 Meter Utuh</text>
  </g>
</svg>

