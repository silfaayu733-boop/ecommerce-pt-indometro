<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </radialGradient>
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wireDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="25%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="75%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <rect width="500" height="500" fill="url(#bgGlow)"/>
  <ellipse cx="250" cy="435" rx="160" ry="24" fill="url(#floorShadow)"/>

  <!-- Coil of Black Tie Wire (Gulungan Kawat Bendrat) -->
  <g transform="translate(250, 240)">
    <!-- Outer Coil Torus Rings 3D Illusion -->
    <!-- Base Body of Wire Torus -->
    <ellipse cx="0" cy="20" rx="145" ry="85" fill="#0f172a" stroke="#334155" stroke-width="4"/>
    <ellipse cx="0" cy="-10" rx="145" ry="85" fill="url(#wireDark)" stroke="#1e293b" stroke-width="3"/>

    <!-- Inner Hole (Lubang Tengah Gulungan) -->
    <ellipse cx="0" cy="-10" rx="65" ry="38" fill="#e2e8f0" stroke="#0f172a" stroke-width="3"/>
    <ellipse cx="0" cy="10" rx="65" ry="38" fill="none" stroke="#334155" stroke-width="3"/>

    <!-- Concentric Wire Strands (Lilitan Kawat Beruntun) -->
    <g fill="none" stroke="#64748b" stroke-width="2.5" opacity="0.8">
      <ellipse cx="0" cy="-10" rx="138" ry="80"/>
      <ellipse cx="0" cy="-10" rx="130" ry="75"/>
      <ellipse cx="0" cy="-10" rx="122" ry="70"/>
      <ellipse cx="0" cy="-10" rx="114" ry="65"/>
      <ellipse cx="0" cy="-10" rx="106" ry="60"/>
      <ellipse cx="0" cy="-10" rx="98" ry="55"/>
      <ellipse cx="0" cy="-10" rx="90" ry="50"/>
      <ellipse cx="0" cy="-10" rx="82" ry="46"/>
      <ellipse cx="0" cy="-10" rx="74" ry="42"/>
    </g>

    <!-- Wire Shine Highlights -->
    <g fill="none" stroke="#f8fafc" stroke-width="1.8" opacity="0.6">
      <path d="M -120,-30 C -60,-70 60,-70 120,-30"/>
      <path d="M -100,-20 C -50,-50 50,-50 100,-20"/>
    </g>

    <!-- Wire Ties around Coil (Tali Pengikat Bendrat Kawat) -->
    <g stroke="#e2e8f0" stroke-width="4" fill="none">
      <path d="M -145,-10 C -145,20 -65,20 -65,-10"/>
      <path d="M 65,-10 C 65,20 145,20 145,-10"/>
      <path d="M 0,-85 C 0,-50 0,25 0,65"/>
    </g>

    <!-- Hanging Tag -->
    <g transform="translate(70, -20) rotate(15)">
      <polygon points="0,0 75,0 70,55 -5,55" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>
      <text x="35" y="22" font-family="'Arial Black', sans-serif" font-size="12" font-weight="900" fill="#0f172a" text-anchor="middle">BWG 21</text>
      <text x="35" y="42" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#dc2626" text-anchor="middle">20 KG</text>
    </g>
  </g>

  <!-- Product Badge -->
  <g transform="translate(250, 405)">
    <rect x="-170" y="-30" width="340" height="56" rx="10" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
    <text x="0" y="-6" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">KAWAT BENDRAT HITAM 20 KG</text>
    <text x="0" y="16" font-family="'Arial', sans-serif" font-size="12" font-weight="bold" fill="#fde047" text-anchor="middle">Ulet, Lentur, Tidak Mudah Putus &#8226; Pengikat Besi Cor</text>
  </g>
</svg>

