<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="rollerCylinder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="80%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="steelArm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="blueGrip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="rollerShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="20" fill="url(#bgGrad)"/>
  <circle cx="250" cy="260" r="170" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="250" cy="430" rx="150" ry="20" fill="#64748b" opacity="0.35" filter="blur(6px)"/>

  <!-- Paint Roller Assembly -->
  <g filter="url(#rollerShadow)">
    <!-- 1. Horizontal Roller Cylinder (9 Inch) -->
    <!-- Cylinder Base -->
    <rect x="110" y="110" width="280" height="90" rx="16" fill="url(#rollerCylinder)" stroke="#64748b" stroke-width="2"/>

    <!-- Fluffy Nap Texture Stripes (Yellow & Blue Diagonal Stripes characteristic of Ace Oldfields) -->
    <path d="M 140 110 L 170 110 L 130 200 L 100 200 Z" fill="#facc15" opacity="0.8"/>
    <path d="M 200 110 L 230 110 L 190 200 L 160 200 Z" fill="#0284c7" opacity="0.8"/>
    <path d="M 260 110 L 290 110 L 250 200 L 220 200 Z" fill="#facc15" opacity="0.8"/>
    <path d="M 320 110 L 350 110 L 310 200 L 280 200 Z" fill="#0284c7" opacity="0.8"/>
    <path d="M 380 110 L 390 110 L 370 200 L 340 200 Z" fill="#facc15" opacity="0.8"/>

    <!-- Cylinder End Caps -->
    <ellipse cx="110" cy="155" rx="8" ry="43" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
    <ellipse cx="390" cy="155" rx="8" ry="43" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    <circle cx="390" cy="155" r="8" fill="#334155"/>

    <!-- Wet Paint Effect (Fresh Wall Paint on Bottom of Roller) -->
    <path d="M 112 175 Q 250 205 388 175 L 388 200 Q 250 205 112 200 Z" fill="#0284c7" opacity="0.9"/>

    <!-- 2. Bent Steel Wire Frame / Arm -->
    <path d="M 390 155 L 430 155 L 430 260 L 250 260 L 250 310" fill="none" stroke="url(#steelArm)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 3. Plastic Handle Grip -->
    <rect x="235" y="310" width="30" height="110" rx="10" fill="url(#blueGrip)" stroke="#1e3a8a" stroke-width="2"/>
    <!-- Ergonomic finger grooves -->
    <line x1="235" y1="335" x2="265" y2="335" stroke="#1e3a8a" stroke-width="3"/>
    <line x1="235" y1="360" x2="265" y2="360" stroke="#1e3a8a" stroke-width="3"/>
    <line x1="235" y1="385" x2="265" y2="385" stroke="#1e3a8a" stroke-width="3"/>
    
    <!-- Extension Pole Thread Opening at Bottom -->
    <ellipse cx="250" cy="420" rx="12" ry="5" fill="#0f172a"/>

    <!-- Branding Text on Handle -->
    <text x="250" y="350" font-family="'Arial Black', Impact, sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle" transform="rotate(-90 250 350)">ACE 9"</text>
  </g>

  <!-- Top Spec Ribbon -->
  <rect x="25" y="25" width="230" height="34" rx="8" fill="#0284c7"/>
  <text x="140" y="47" font-family="'Arial', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">ROLL CAT TEMBOK 9 INCH</text>

  <!-- Quality Stamp -->
  <g transform="translate(425, 70)">
    <circle cx="0" cy="0" r="32" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="-8" font-family="'Arial Black', sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">LENGKAP</text>
    <text x="0" y="7" font-family="'Arial Black', sans-serif" font-size="11" font-weight="900" fill="#facc15" text-anchor="middle">GAGANG</text>
    <text x="0" y="18" font-family="'Arial', sans-serif" font-size="7" font-weight="bold" fill="#38bdf8" text-anchor="middle">BULU TEBAL</text>
  </g>

  <!-- Bottom Info -->
  <rect x="130" y="450" width="240" height="24" rx="12" fill="#1e293b"/>
  <text x="250" y="466" font-family="'Arial', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">CAT RATA CEPAT &#8226; TIDAK CIPRAT</text>
</svg>
