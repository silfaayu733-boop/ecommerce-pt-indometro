<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </radialGradient>
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hoeSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="25%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="doranWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="40%" stop-color="#b45309"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>

  <rect width="500" height="500" fill="url(#bgGlow)"/>
  <ellipse cx="250" cy="435" rx="160" ry="22" fill="url(#floorShadow)"/>

  <!-- Traditional Steel Hoe (Cangkul Baja Gagang Kayu / Doran) -->
  <g transform="translate(230, 210) rotate(-30)">
    <!-- Wooden Handle (Doran Kayu Jati / Mahoni Panjang) -->
    <rect x="-13" y="-120" width="26" height="260" rx="8" fill="url(#doranWood)" stroke="#451a03" stroke-width="2.5"/>
    <rect x="-4" y="-120" width="8" height="260" fill="#fde047" opacity="0.3"/>

    <!-- Eye Socket on Blade (Bawon / Lubang Gagang Cangkul) -->
    <g transform="translate(0, 110)">
      <ellipse cx="0" cy="0" rx="20" ry="12" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
      <!-- Wooden wedge holding the handle tight -->
      <polygon points="-8,-6 8,-6 4,4 -4,4" fill="#d97706"/>

      <!-- Curved Steel Hoe Blade (Bilah Cangkul Plat Baja Tempa) -->
      <path d="M -70,5 C -65,30 -60,90 -55,140 C -53,150 53,150 55,140 C 60,90 65,30 70,5 Z" 
            fill="url(#hoeSteel)" stroke="#0f172a" stroke-width="3"/>

      <!-- Central Reinforcing Rib (Garis Punggung Cangkul) -->
      <path d="M 0,10 L 0,135" stroke="#64748b" stroke-width="5" fill="none"/>
      
      <!-- Sharpened Cutting Edge (Mata Cangkul Baja Tajam Asah) -->
      <polygon points="-56,136 56,136 53,144 -53,144" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

      <!-- Traditional Blacksmith Punch Stamp (Cap Pabrik Pandai Besi) -->
      <circle cx="0" cy="50" r="14" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
      <text x="0" y="54" font-family="'Arial Black', sans-serif" font-size="10" font-weight="900" fill="#f59e0b" text-anchor="middle">BAJA</text>
    </g>
  </g>

  <!-- Product Badge -->
  <g transform="translate(250, 405)">
    <rect x="-170" y="-30" width="340" height="56" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="3"/>
    <text x="0" y="-6" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">CANGKUL BAJA ASLI GAGANG KAYU</text>
    <text x="0" y="16" font-family="'Arial', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">Baja Tempa Kuat &amp; Tajam &#8226; Doran Kayu Solid Tahan Lama</text>
  </g>
</svg>

