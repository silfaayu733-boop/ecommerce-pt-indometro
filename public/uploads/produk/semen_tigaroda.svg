<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Shadow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <!-- Kraft Sack Texture -->
    <linearGradient id="kraftGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf0d5"/>
      <stop offset="30%" stop-color="#e6ccb2"/>
      <stop offset="70%" stop-color="#ddb892"/>
      <stop offset="100%" stop-color="#b08968"/>
    </linearGradient>
    <linearGradient id="sackShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Studio Background -->
  <rect width="500" height="500" fill="url(#bgGlow)"/>

  <!-- Floor Shadow -->
  <ellipse cx="250" cy="445" rx="170" ry="25" fill="url(#floorShadow)"/>

  <!-- Cement Bag 3D Shape -->
  <g transform="translate(0, 5)">
    <!-- Main Sack Body -->
    <path d="M 125,95 C 130,80 370,80 375,95 C 390,140 395,380 380,420 C 365,435 135,435 120,420 C 105,380 110,140 125,95 Z" 
          fill="url(#kraftGradient)" stroke="#9c6644" stroke-width="3"/>
    
    <!-- Top & Bottom Stitched Folds -->
    <path d="M 120,95 Q 250,110 380,95" stroke="#7f4f24" stroke-width="4" stroke-dasharray="6,4" fill="none"/>
    <path d="M 115,420 Q 250,435 385,420" stroke="#7f4f24" stroke-width="4" stroke-dasharray="6,4" fill="none"/>
    
    <!-- Bag Volume & Crease Shadows -->
    <path d="M 125,95 C 150,180 145,340 120,420" stroke="#b08968" stroke-width="5" fill="none" opacity="0.6"/>
    <path d="M 375,95 C 350,180 355,340 380,420" stroke="#7f4f24" stroke-width="6" fill="none" opacity="0.5"/>
    <path d="M 160,100 L 175,420" fill="url(#sackShine)" width="60" opacity="0.4"/>

    <!-- Tiga Roda Red/Blue Circular Logo -->
    <g transform="translate(250, 205)">
      <!-- Outer Circles -->
      <circle r="62" fill="#ffffff" stroke="#c1121f" stroke-width="4"/>
      <circle r="54" fill="#003049" stroke="#ffffff" stroke-width="2"/>
      
      <!-- Three Cog Wheels / Roda -->
      <!-- Wheel 1 Top -->
      <circle cx="0" cy="-22" r="16" fill="#fdf0d5" stroke="#c1121f" stroke-width="3"/>
      <circle cx="0" cy="-22" r="6" fill="#c1121f"/>
      <!-- Wheel 2 Left -->
      <circle cx="-19" cy="14" r="16" fill="#fdf0d5" stroke="#c1121f" stroke-width="3"/>
      <circle cx="-19" cy="14" r="6" fill="#c1121f"/>
      <!-- Wheel 3 Right -->
      <circle cx="19" cy="14" r="16" fill="#fdf0d5" stroke="#c1121f" stroke-width="3"/>
      <circle cx="19" cy="14" r="6" fill="#c1121f"/>
    </g>

    <!-- Brand Typography -->
    <text x="250" y="295" font-family="'Arial Black', Impact, sans-serif" font-size="25" font-weight="900" fill="#c1121f" text-anchor="middle" letter-spacing="1">SEMEN TIGA RODA</text>
    <text x="250" y="318" font-family="'Arial', sans-serif" font-size="12" font-weight="bold" fill="#003049" text-anchor="middle" letter-spacing="2">PORTLAND COMPOSITE CEMENT</text>
    
    <!-- Quality Seal -->
    <rect x="180" y="332" width="140" height="24" rx="12" fill="#003049"/>
    <text x="250" y="348" font-family="'Arial', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">SNI 2049 : 2015</text>

    <!-- Weight Badge -->
    <g transform="translate(250, 395)">
      <rect x="-75" y="-18" width="150" height="32" rx="6" fill="#c1121f"/>
      <text x="0" y="4" font-family="'Arial Black', sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">50 KG</text>
    </g>
  </g>
</svg>

