<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </radialGradient>
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="marbleGloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="tileShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="500" height="500" fill="url(#bgGlow)"/>
  <ellipse cx="250" cy="435" rx="170" ry="22" fill="url(#floorShadow)"/>

  <!-- 3D Perspective Tile Group -->
  <g transform="translate(250, 230)">
    <!-- Tile Thickness Edge (Ketebalan Keramik) -->
    <!-- Front Edge -->
    <polygon points="-160,50 0,140 160,50 160,65 0,155 -160,65" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
    <polygon points="0,140 160,50 160,65 0,155" fill="#64748b"/>

    <!-- Main Tile Top Face in Isometric Perspective -->
    <polygon points="0,-130 160,50 0,140 -160,50" fill="url(#marbleGloss)" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Marble Texture Veins (Urat Marmer Abu & Emas) -->
    <!-- Vein 1 -->
    <path d="M -110,-40 Q -70,20 -20,10 T 60,60 T 120,30" fill="none" stroke="#94a3b8" stroke-width="3" opacity="0.45"/>
    <path d="M -110,-40 Q -70,20 -20,10 T 60,60 T 120,30" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.3"/>
    
    <!-- Vein 2 -->
    <path d="M -40,-100 Q 10,-30 -10,30 T 40,110" fill="none" stroke="#64748b" stroke-width="2.5" opacity="0.4"/>
    <path d="M -20,-10 Q 30,0 70,-40 T 130,-20" fill="none" stroke="#94a3b8" stroke-width="2" opacity="0.35"/>
    
    <!-- Small Micro Veins -->
    <path d="M -130,20 Q -90,-10 -60,40" fill="none" stroke="#94a3b8" stroke-width="1.5" opacity="0.3"/>
    <path d="M 40,70 Q 70,100 110,80" fill="none" stroke="#d97706" stroke-width="1.2" opacity="0.3"/>

    <!-- High Gloss Sheen Overlay (Efek Pantulan Mengkilap) -->
    <polygon points="0,-130 110,-5 -40,110 -150,-15" fill="url(#tileShine)"/>

    <!-- Roman Brand Emblem Stamped on Tile Corner -->
    <g transform="translate(0, -60)">
      <circle r="36" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
      <text x="0" y="2" font-family="'Times New Roman', serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">ROMAN</text>
      <text x="0" y="15" font-family="'Arial', sans-serif" font-size="8" font-weight="bold" fill="#f59e0b" text-anchor="middle" letter-spacing="1">CERAMICS</text>
    </g>
  </g>

  <!-- Product Spec Badge -->
  <g transform="translate(250, 405)">
    <rect x="-170" y="-30" width="340" height="56" rx="10" fill="#0f172a" stroke="#d97706" stroke-width="3"/>
    <text x="0" y="-6" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">KERAMIK ROMAN MARMER 40x40</text>
    <text x="0" y="16" font-family="'Arial', sans-serif" font-size="12" font-weight="bold" fill="#fef08a" text-anchor="middle">White Marble Glossy | 1 Dus = 1 m² (6 Pcs)</text>
  </g>
</svg>

