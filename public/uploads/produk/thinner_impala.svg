<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="canBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="35%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="impalaRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="metalCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="tinShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="20" fill="url(#bgGrad)"/>
  <circle cx="250" cy="260" r="170" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="250" cy="425" rx="120" ry="20" fill="#64748b" opacity="0.35" filter="blur(6px)"/>

  <!-- Rectangular / Cylindrical Metal Thinner Tin Can -->
  <g filter="url(#tinShadow)">
    <!-- Main Tin Body -->
    <rect x="170" y="160" width="160" height="240" rx="16" fill="url(#canBody)" stroke="#475569" stroke-width="2"/>

    <!-- Top Metal Neck and Cap -->
    <rect x="230" y="135" width="40" height="25" rx="4" fill="url(#metalCap)" stroke="#475569" stroke-width="1.5"/>
    <rect x="225" y="125" width="50" height="12" rx="3" fill="#dc2626"/>

    <!-- Top Metal Folding Handle -->
    <path d="M 200 160 Q 250 145 300 160" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>

    <!-- Red Label Front Face -->
    <rect x="180" y="180" width="140" height="205" rx="8" fill="url(#impalaRed)"/>

    <!-- White Crest / Banner for Brand -->
    <rect x="190" y="200" width="120" height="70" rx="6" fill="#ffffff"/>
    
    <!-- Deer / Impala Antelope Logo Silhouette -->
    <path d="M 250 205 Q 240 215 250 225 Q 260 215 250 205 Z" fill="#b91c1c"/>
    <text x="250" y="245" font-family="'Arial Black', Impact, sans-serif" font-size="24" font-weight="900" fill="#b91c1c" text-anchor="middle" letter-spacing="1">IMPALA</text>
    <text x="250" y="260" font-family="'Arial Black', sans-serif" font-size="9" font-weight="900" fill="#0f172a" text-anchor="middle">SUPER GLOSS</text>

    <!-- Indonesian Description on Label -->
    <text x="250" y="295" font-family="'Arial Black', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">THINNER SERBAGUNA</text>
    <text x="250" y="312" font-family="'Arial', sans-serif" font-size="8" font-weight="bold" fill="#fef08a" text-anchor="middle">PENGENCER CAT BESI &amp; KAYU</text>

    <!-- Flammable Symbol / Api -->
    <g transform="translate(250, 340)">
      <polygon points="0,-15 15,10 -15,10" fill="#facc15" stroke="#000000" stroke-width="1"/>
      <path d="M 0 5 Q -4 0 0 -8 Q 4 0 0 5 Z" fill="#dc2626"/>
      <text x="0" y="20" font-family="'Arial Black', sans-serif" font-size="7" font-weight="900" fill="#ffffff" text-anchor="middle">MUDAH TERBAKAR</text>
    </g>

    <!-- Volume 1 Liter -->
    <rect x="220" y="365" width="60" height="15" rx="4" fill="#0f172a"/>
    <text x="250" y="376" font-family="'Arial', sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">ISI: 1 LITER</text>
  </g>

  <!-- Top Spec Ribbon -->
  <rect x="25" y="25" width="220" height="34" rx="8" fill="#b91c1c"/>
  <text x="135" y="47" font-family="'Arial', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">THINNER IMPALA 1 LITER</text>

  <!-- Quality Stamp -->
  <g transform="translate(425, 70)">
    <circle cx="0" cy="0" r="32" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="-8" font-family="'Arial Black', sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">SUPER</text>
    <text x="0" y="7" font-family="'Arial Black', sans-serif" font-size="12" font-weight="900" fill="#facc15" text-anchor="middle">GLOSS</text>
    <text x="0" y="18" font-family="'Arial', sans-serif" font-size="7" font-weight="bold" fill="#38bdf8" text-anchor="middle">ORIGINAL</text>
  </g>

  <!-- Bottom Info -->
  <rect x="130" y="450" width="240" height="24" rx="12" fill="#1e293b"/>
  <text x="250" y="466" font-family="'Arial', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">PENGENCER CAT MINYAK &amp; DUCO</text>
</svg>
