<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="sandDarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="40%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="sandLightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="truckBed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadowFilter" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.3"/>
    </filter>
    <pattern id="sandTexture" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r="1.5" fill="#94a3b8" opacity="0.6"/>
      <circle cx="15" cy="7" r="1.8" fill="#cbd5e1" opacity="0.5"/>
      <circle cx="9" cy="15" r="1.3" fill="#0f172a" opacity="0.7"/>
      <circle cx="18" cy="18" r="1.6" fill="#64748b" opacity="0.6"/>
      <circle cx="6" cy="11" r="1" fill="#e2e8f0" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="20" fill="url(#bgGrad)"/>

  <!-- Shadow Base -->
  <ellipse cx="250" cy="435" rx="200" ry="28" fill="#64748b" opacity="0.35" filter="blur(8px)"/>

  <!-- Truck Bed / Bak Pick Up Container -->
  <g filter="url(#shadowFilter)">
    <!-- Wooden / Steel Truck Bed Base -->
    <path d="M 50 360 L 450 360 L 430 420 L 70 420 Z" fill="url(#truckBed)"/>
    <!-- Steel ribs / strips -->
    <line x1="120" y1="360" x2="135" y2="420" stroke="#1e293b" stroke-width="4"/>
    <line x1="200" y1="360" x2="210" y2="420" stroke="#1e293b" stroke-width="4"/>
    <line x1="280" y1="360" x2="285" y2="420" stroke="#1e293b" stroke-width="4"/>
    <line x1="360" y1="360" x2="360" y2="420" stroke="#1e293b" stroke-width="4"/>

    <!-- Bak Lip Header -->
    <rect x="45" y="350" width="410" height="15" rx="3" fill="#1e40af"/>

    <!-- Tailgate Handle / Reflectors -->
    <circle cx="90" cy="390" r="8" fill="#f59e0b"/>
    <circle cx="410" cy="390" r="8" fill="#f59e0b"/>
    <rect x="210" y="380" width="80" height="20" rx="4" fill="#0f172a"/>
    <text x="250" y="394" font-family="'Arial', sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">1 PICK UP (COLT)</text>

    <!-- Mountain Heap of Coarse Black Sand (Pasir Cor) -->
    <!-- Rear mound -->
    <path d="M 60 355 Q 160 170 250 175 Q 350 170 440 355 Z" fill="url(#sandDarkGrad)"/>
    
    <!-- Main Center Mound with ridges -->
    <path d="M 60 355 Q 150 150 240 145 Q 360 160 440 355 Z" fill="url(#sandLightGrad)"/>
    <path d="M 120 355 Q 220 180 250 170 Q 320 220 400 355 Z" fill="#334155" opacity="0.6"/>

    <!-- Sand Grain Texture Overlay -->
    <path d="M 60 355 Q 150 150 240 145 Q 360 160 440 355 Z" fill="url(#sandTexture)"/>

    <!-- Gravel / Aggregate Stones Embedded (Batu Kerikil Cor) -->
    <ellipse cx="180" cy="260" rx="9" ry="6" fill="#64748b" stroke="#334155" stroke-width="1.5"/>
    <ellipse cx="230" cy="210" rx="12" ry="8" fill="#475569" stroke="#1e293b" stroke-width="2"/>
    <ellipse cx="310" cy="270" rx="10" ry="7" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
    <ellipse cx="270" cy="310" rx="14" ry="9" fill="#475569" stroke="#0f172a" stroke-width="2"/>
    <ellipse cx="140" cy="320" rx="11" ry="7" fill="#64748b" stroke="#334155" stroke-width="1.5"/>
    <ellipse cx="350" cy="325" rx="13" ry="8" fill="#475569" stroke="#1e293b" stroke-width="2"/>
    <ellipse cx="210" cy="280" rx="8" ry="5" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>

    <!-- Quality Stamp Badge -->
    <g transform="translate(370, 180)">
      <circle cx="0" cy="0" r="42" fill="#0284c7" stroke="#ffffff" stroke-width="3"/>
      <circle cx="0" cy="0" r="36" fill="none" stroke="#bae6fd" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="0" y="-12" font-family="'Arial Black', sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">MUTU COR</text>
      <text x="0" y="3" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#facc15" text-anchor="middle">KASAR</text>
      <text x="0" y="16" font-family="'Arial', sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">BEBAS LUMPUR</text>
    </g>
  </g>

  <!-- Product Title Banner at Top -->
  <rect x="25" y="25" width="220" height="34" rx="8" fill="#0f172a"/>
  <text x="135" y="47" font-family="'Arial', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">PASIR COR BETON KASAR</text>

  <!-- Tagline at Bottom -->
  <rect x="110" y="445" width="280" height="24" rx="12" fill="#334155"/>
  <text x="250" y="461" font-family="'Arial', sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">KHUSUS COR DAK, CAKAR AYAM &amp; KOLOM</text>
</svg>
