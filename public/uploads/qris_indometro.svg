<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 680" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <g filter="url(#cardShadow)">
    <rect x="25" y="20" width="450" height="640" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Red Top Accent Bar -->
    <path d="M 25 35 Q 25 20 45 20 L 455 20 Q 475 20 475 35 L 475 40 L 25 40 Z" fill="#ef4444"/>
  </g>

  <!-- QRIS Header Logo -->
  <g transform="translate(180, 55)">
    <!-- Stylized QRIS text logo -->
    <text x="0" y="32" font-family="'Arial Black', Impact, sans-serif" font-size="34" font-weight="900" fill="#ef4444" letter-spacing="-1">QRIS</text>
    <text x="95" y="20" font-family="'Arial', sans-serif" font-size="7" font-weight="bold" fill="#0f172a">QUICK RESPONSE CODE</text>
    <text x="95" y="30" font-family="'Arial', sans-serif" font-size="7" font-weight="bold" fill="#0f172a">INDONESIAN STANDARD</text>
  </g>

  <!-- Divider Line -->
  <line x1="50" y1="105" x2="450" y2="105" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Merchant Information -->
  <text x="250" y="132" font-family="'Arial Black', Impact, sans-serif" font-size="18" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="1">PT. INDO METRO SURYA ANDOLA</text>
  <text x="250" y="150" font-family="'Arial', sans-serif" font-size="11" font-weight="bold" fill="#64748b" text-anchor="middle">NMID : ID1024398711090 &#8226; A01</text>
  <text x="250" y="166" font-family="'Arial', sans-serif" font-size="10" font-weight="bold" fill="#0284c7" text-anchor="middle">Toko Bahan Bangunan &amp; Perkakas Kota Metro</text>

  <!-- QR Code Container Box -->
  <rect x="75" y="180" width="350" height="350" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- High-Precision Vector QR Code Pattern -->
  <g transform="translate(95, 200)">
    <!-- Top-Left Finder Pattern -->
    <rect x="0" y="0" width="70" height="70" rx="6" fill="#000000"/>
    <rect x="10" y="10" width="50" height="50" rx="4" fill="#ffffff"/>
    <rect x="20" y="20" width="30" height="30" rx="2" fill="#000000"/>

    <!-- Top-Right Finder Pattern -->
    <rect x="240" y="0" width="70" height="70" rx="6" fill="#000000"/>
    <rect x="250" y="10" width="50" height="50" rx="4" fill="#ffffff"/>
    <rect x="260" y="20" width="30" height="30" rx="2" fill="#000000"/>

    <!-- Bottom-Left Finder Pattern -->
    <rect x="0" y="240" width="70" height="70" rx="6" fill="#000000"/>
    <rect x="10" y="250" width="50" height="50" rx="4" fill="#ffffff"/>
    <rect x="20" y="260" width="30" height="30" rx="2" fill="#000000"/>

    <!-- Alignment Pattern (Small square bottom-right) -->
    <rect x="230" y="230" width="30" height="30" rx="2" fill="#000000"/>
    <rect x="236" y="236" width="18" height="18" rx="1" fill="#ffffff"/>
    <rect x="241" y="241" width="8" height="8" fill="#000000"/>

    <!-- Timing Patterns -->
    <line x1="80" y1="35" x2="230" y2="35" stroke="#000000" stroke-width="6" stroke-dasharray="10,10"/>
    <line x1="35" y1="80" x2="35" y2="230" stroke="#000000" stroke-width="6" stroke-dasharray="10,10"/>

    <!-- Data Matrix Pixels Grid simulation (Realistic QR Blocks) -->
    <!-- Column 1-4 -->
    <rect x="80" y="0" width="10" height="20" fill="#000000"/>
    <rect x="100" y="10" width="20" height="10" fill="#000000"/>
    <rect x="130" y="0" width="10" height="30" fill="#000000"/>
    <rect x="150" y="10" width="20" height="20" fill="#000000"/>
    <rect x="180" y="0" width="10" height="20" fill="#000000"/>
    <rect x="200" y="10" width="20" height="10" fill="#000000"/>

    <rect x="0" y="80" width="20" height="10" fill="#000000"/>
    <rect x="10" y="100" width="20" height="20" fill="#000000"/>
    <rect x="0" y="130" width="10" height="20" fill="#000000"/>
    <rect x="10" y="160" width="20" height="10" fill="#000000"/>
    <rect x="0" y="180" width="10" height="30" fill="#000000"/>
    <rect x="10" y="220" width="20" height="10" fill="#000000"/>

    <!-- Central Matrix Area -->
    <rect x="80" y="80" width="20" height="20" fill="#000000"/>
    <rect x="110" y="80" width="10" height="30" fill="#000000"/>
    <rect x="130" y="90" width="20" height="10" fill="#000000"/>
    <rect x="160" y="70" width="10" height="20" fill="#000000"/>
    <rect x="180" y="80" width="30" height="10" fill="#000000"/>
    <rect x="220" y="80" width="20" height="20" fill="#000000"/>
    <rect x="250" y="90" width="20" height="10" fill="#000000"/>
    <rect x="280" y="80" width="10" height="20" fill="#000000"/>
    <rect x="300" y="90" width="10" height="30" fill="#000000"/>

    <rect x="90" y="120" width="20" height="10" fill="#000000"/>
    <rect x="120" y="120" width="10" height="20" fill="#000000"/>
    <rect x="140" y="110" width="20" height="30" fill="#000000"/>
    <rect x="170" y="120" width="20" height="10" fill="#000000"/>
    <rect x="200" y="110" width="10" height="20" fill="#000000"/>
    <rect x="220" y="120" width="30" height="10" fill="#000000"/>
    <rect x="260" y="110" width="10" height="30" fill="#000000"/>
    <rect x="280" y="120" width="20" height="20" fill="#000000"/>

    <rect x="70" y="150" width="30" height="10" fill="#000000"/>
    <rect x="110" y="150" width="10" height="20" fill="#000000"/>
    <rect x="130" y="160" width="20" height="10" fill="#000000"/>
    <rect x="160" y="150" width="10" height="30" fill="#000000"/>
    <rect x="180" y="160" width="30" height="10" fill="#000000"/>
    <rect x="220" y="150" width="10" height="20" fill="#000000"/>
    <rect x="240" y="160" width="20" height="10" fill="#000000"/>
    <rect x="270" y="150" width="20" height="20" fill="#000000"/>
    <rect x="300" y="160" width="10" height="20" fill="#000000"/>

    <rect x="80" y="190" width="10" height="30" fill="#000000"/>
    <rect x="100" y="190" width="30" height="10" fill="#000000"/>
    <rect x="140" y="200" width="10" height="20" fill="#000000"/>
    <rect x="160" y="190" width="20" height="10" fill="#000000"/>
    <rect x="190" y="200" width="20" height="20" fill="#000000"/>
    <rect x="220" y="190" width="10" height="30" fill="#000000"/>
    <rect x="240" y="200" width="20" height="10" fill="#000000"/>
    <rect x="270" y="190" width="10" height="20" fill="#000000"/>
    <rect x="290" y="200" width="20" height="10" fill="#000000"/>

    <rect x="80" y="230" width="20" height="20" fill="#000000"/>
    <rect x="110" y="240" width="20" height="10" fill="#000000"/>
    <rect x="140" y="230" width="10" height="30" fill="#000000"/>
    <rect x="160" y="240" width="20" height="10" fill="#000000"/>
    <rect x="190" y="230" width="30" height="20" fill="#000000"/>
    <rect x="270" y="230" width="20" height="20" fill="#000000"/>
    <rect x="300" y="240" width="10" height="20" fill="#000000"/>

    <rect x="80" y="270" width="20" height="10" fill="#000000"/>
    <rect x="110" y="280" width="10" height="30" fill="#000000"/>
    <rect x="130" y="270" width="30" height="10" fill="#000000"/>
    <rect x="170" y="280" width="20" height="20" fill="#000000"/>
    <rect x="200" y="270" width="20" height="10" fill="#000000"/>
    <rect x="230" y="270" width="10" height="30" fill="#000000"/>
    <rect x="250" y="280" width="30" height="10" fill="#000000"/>
    <rect x="290" y="270" width="20" height="20" fill="#000000"/>

    <!-- Center Icon Stamp: QRIS BI -->
    <rect x="130" y="130" width="50" height="50" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    <circle cx="155" cy="155" r="18" fill="#ef4444"/>
    <text x="155" y="160" font-family="'Arial Black', sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">QR</text>
  </g>

  <!-- Bottom National Payment Banner -->
  <rect x="50" y="545" width="400" height="32" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="250" y="565" font-family="'Arial Black', sans-serif" font-size="11" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="1">SATU QR UNTUK SEMUA PEMBAYARAN</text>

  <!-- Supported Payment Channels Icons Row -->
  <g transform="translate(60, 590)">
    <!-- GoPay -->
    <rect x="0" y="0" width="60" height="24" rx="6" fill="#00aed6"/>
    <text x="30" y="16" font-family="'Arial Black', sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">gopay</text>

    <!-- OVO -->
    <rect x="68" y="0" width="50" height="24" rx="6" fill="#4c2a86"/>
    <text x="93" y="16" font-family="'Arial Black', sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">OVO</text>

    <!-- DANA -->
    <rect x="126" y="0" width="54" height="24" rx="6" fill="#118eea"/>
    <text x="153" y="16" font-family="'Arial Black', sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">DANA</text>

    <!-- ShopeePay -->
    <rect x="188" y="0" width="70" height="24" rx="6" fill="#ee4d2d"/>
    <text x="223" y="15" font-family="'Arial Black', sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">ShopeePay</text>

    <!-- LinkAja -->
    <rect x="266" y="0" width="52" height="24" rx="6" fill="#e1251b"/>
    <text x="292" y="16" font-family="'Arial Black', sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">LinkAja!</text>

    <!-- BCA / Bank -->
    <rect x="326" y="0" width="52" height="24" rx="6" fill="#003399"/>
    <text x="352" y="16" font-family="'Arial Black', sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">M-BANK</text>
  </g>

  <!-- Security Notice at bottom -->
  <text x="250" y="640" font-family="'Arial', sans-serif" font-size="9" font-weight="bold" fill="#94a3b8" text-anchor="middle">Berizin dan diawasi oleh Bank Indonesia</text>
</svg>
